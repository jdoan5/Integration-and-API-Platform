spring.application.name=soap-inventory-service
server.port=${SERVER_PORT:8081}

# ---------------------------------------------------------------------------
# All connection settings are environment-overridable so nothing machine- or
# person-specific is committed. The nested defaults mean it still works with
# zero configuration on a dev laptop:
#   DB_USER if set, else your shell $USER, else "postgres".
# Copy .env.example to .env and adjust for anything non-default.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_mgmt}
spring.datasource.username=${DB_USER:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# NOTE: the app starts fine even with Postgres down - Hikari creates the pool
# lazily, so you only find out on the first call that touches the database
# (you get a SOAP Server fault, not a startup error). That is worth knowing:
# "it started" does not mean "its dependencies are healthy". Phase 3 adds a
# Kong health check against /actuator/health, which is the real fix.

# ---------------------------------------------------------------------------
# Actuator - /actuator/health is what Kong will probe in Phase 3.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------------
# Log the raw SOAP envelopes. Invaluable while learning: you see exactly what
# went over the wire, including the faults. Turn off once it gets noisy.
# ---------------------------------------------------------------------------
logging.level.org.springframework.ws.server.MessageTracing.sent=TRACE
logging.level.org.springframework.ws.server.MessageTracing.received=TRACE
logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
logging.level.org.springframework.ws.client.MessageTracing.received=TRACE

# ---------------------------------------------------------------------------
# Put the correlation id in every log line. %X{correlationId} reads the MDC
# value set by CorrelationIdFilter, so one grep reconstructs a request's whole
# path across Kong -> REST facade -> this service.
# ---------------------------------------------------------------------------
logging.pattern.level=%5p [${spring.application.name}] [%X{correlationId:-no-trace}]

spring.application.name=soap-inventory-service
server.port=8081

# ---------------------------------------------------------------------------
# Points at the database you built in the SQL project.
# Postgres.app runs on 5432 with your macOS username and no password.
# Override without editing this file:
#   SPRING_DATASOURCE_USERNAME=someone ./mvnw spring-boot:run
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_mgmt
spring.datasource.username=${USER:jdoan}
spring.datasource.password=

# Fail fast at startup if the database is unreachable, rather than on first call.
spring.datasource.hikari.initialization-fail-timeout=5000

# ---------------------------------------------------------------------------
# Actuator - /actuator/health is what Kong will probe in Phase 3.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------------
# Log the raw SOAP envelopes. Invaluable while learning: you see exactly what
# went over the wire, including the faults. Turn off once it gets noisy.
# ---------------------------------------------------------------------------
logging.level.org.springframework.ws.server.MessageTracing.sent=TRACE
logging.level.org.springframework.ws.server.MessageTracing.received=TRACE
logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
logging.level.org.springframework.ws.client.MessageTracing.received=TRACE

spring.application.name=events
server.port=${SERVER_PORT:8083}

# --- the database that holds the outbox and the read model -----------------
# ---------------------------------------------------------------------------
# All connection settings are environment-overridable so nothing machine- or
# person-specific is committed. The nested defaults mean it still works with
# zero configuration on a dev laptop:
#   DB_USER if set, else your shell $USER, else "postgres".
# Copy .env.example to .env and adjust for anything non-default.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_mgmt}
spring.datasource.username=${DB_USER:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# --- Kafka ------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8085}

# Producer side: Avro values, String keys. The serializer registers the schema
# with the registry on first send and embeds its ID in every message.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8085}
# acks=all: the broker only ACKs once all in-sync replicas have the record.
# With acks=1 a broker crash right after the ACK loses the event - which would
# defeat the whole point of the outbox.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# --- outbox relay -----------------------------------------------------------
outbox.poll-interval-ms=1000

management.endpoints.web.exposure.include=health,info,metrics
logging.level.com.jdoan.inventory.events=DEBUG

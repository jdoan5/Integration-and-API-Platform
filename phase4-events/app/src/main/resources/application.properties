spring.application.name=events
server.port=8083

# --- the database that holds the outbox and the read model -----------------
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_mgmt
spring.datasource.username=${USER:jdoan}
spring.datasource.password=

# --- Kafka ------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
schema.registry.url=http://localhost:8085

# Producer side: Avro values, String keys. The serializer registers the schema
# with the registry on first send and embeds its ID in every message.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8085
# acks=all: the broker only ACKs once all in-sync replicas have the record.
# With acks=1 a broker crash right after the ACK loses the event - which would
# defeat the whole point of the outbox.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# --- outbox relay -----------------------------------------------------------
outbox.poll-interval-ms=1000

management.endpoints.web.exposure.include=health,info,metrics
logging.level.com.jdoan.inventory.events=DEBUG

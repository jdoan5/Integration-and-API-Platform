spring.application.name=rest-facade
server.port=${SERVER_PORT:8082}

# ---------------------------------------------------------------------------
# Upstream SOAP service (Phase 1). Must be running on 8081.
# ---------------------------------------------------------------------------
inventory.soap.uri=${SOAP_URI:http://localhost:8081/ws}

# ---------------------------------------------------------------------------
# Redis - docker compose up -d redis
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.com.jdoan.inventory.rest=DEBUG

# ---------------------------------------------------------------------------
# Distributed tracing (Phase 7) - export to Jaeger over OTLP.
#
# Sampling is 1.0 because this is a laptop and a demo: a trace you cannot find
# proves nothing. In production this is the first dial you turn down, and the
# reason tail-based sampling exists - you want the 1% of traces that were slow
# or failed, which head-based sampling cannot know in advance.
# ---------------------------------------------------------------------------
management.tracing.sampling.probability=${TRACE_SAMPLE:1.0}
# Boot 4 property name. Boot 3's `management.otlp.tracing.endpoint` is silently
# ignored here - no warning, no traces, nothing to grep for.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.enabled=true

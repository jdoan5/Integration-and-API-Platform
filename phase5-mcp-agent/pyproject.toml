[project]
name = "inventory-mcp-agent"
version = "0.1.0"
description = "Phase 5 - MCP server and LangGraph agent over the inventory integration platform"
requires-python = ">=3.11"
dependencies = [
    # Upper bound is load-bearing, not caution. mcp 2.x renamed FastMCP to
    # MCPServer and REMOVED mcp.server.fastmcp, so 2.x is an import error here,
    # and langchain-mcp-adapters pins mcp<2 anyway. Without this bound,
    # `pip install -e .` without the agent extra silently installs 2.x.
    "mcp>=1.29.0,<2.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
agent = [
    "langgraph>=1.2.0",
    "langchain>=1.3.0",
    "langchain-core>=1.6.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
    "ruff>=0.5.0",
]

[project.scripts]
inventory-mcp = "inventory_mcp.__main__:main"
inventory-agent = "agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inventory_mcp*", "agent*"]
exclude = ["tests*", ".venv*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

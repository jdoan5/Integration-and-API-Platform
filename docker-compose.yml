# ============================================================================
# Shared infrastructure for the platform.
#
#   docker compose up -d redis          # Phase 2
#   docker compose up -d redis kong     # Phase 3
#   docker compose up -d kafka schema-registry   # Phase 4
#
# Kong reaches the Java services on the host via host.docker.internal.
#
# PostgreSQL is deliberately NOT here - it runs in Postgres.app and already
# holds the inventory_mgmt data from the database project.
# ============================================================================
services:
  redis:
    image: redis:7-alpine
    container_name: iap-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  # --------------------------------------------------------------------------
  # Kong in DB-less mode: the entire config comes from phase3-gateway/kong.yml.
  #   8000 = proxy (where consumers send traffic)
  #   8001 = admin API + /metrics (read-only here; config comes from the file)
  # --------------------------------------------------------------------------
  kong:
    image: kong:3.9
    container_name: iap-kong
    depends_on:
      redis:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PLUGINS: "bundled"
      # Drop server_tokens so Kong stops advertising "Server: kong/3.9.3" and
      # "Via: kong/3.9.3". Version disclosure tells an attacker exactly which
      # CVEs to try. Keep the latency + request-id headers, which are useful
      # for debugging and carry no version information.
      KONG_HEADERS: "latency_tokens,X-Kong-Request-Id"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./phase3-gateway/kong.yml:/kong/kong.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Kafka in KRaft mode - no ZooKeeper. A single node acting as both broker
  # and controller, which is all a laptop needs.
  #
  # Two listeners matter here:
  #   PLAINTEXT      (kafka:29092)     - for other CONTAINERS
  #   PLAINTEXT_HOST (localhost:9092)  - for processes on the MAC HOST
  # A client always connects once to get the advertised address and then
  # reconnects to THAT, so advertising the wrong one is the classic
  # "connects then times out" Kafka failure.
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: iap-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "iap-local-cluster-0001"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # --------------------------------------------------------------------------
  # Schema Registry - the CONTRACT REGISTRY for events.
  #
  # This is the Phase 4 counterpart to the XSD in Phase 1: a central place
  # that stores the schema and REFUSES incompatible changes. Note what the XSD
  # has no equivalent of - a runtime that can reject your breaking change
  # before it ships.
  # --------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: iap-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8085"
      # BACKWARD: a new schema must be able to read data written by the old one.
      # This is the setting that turns "we should not break consumers" from a
      # code-review convention into something the infrastructure enforces.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --------------------------------------------------------------------------
  # Jaeger - where the traces land (Phase 7).
  #
  # Phase 3 added a correlation ID: one value carried across every hop, which
  # tells you WHICH request you are looking at. It cannot tell you what that
  # request DID, in what order, or where the time went. A trace is the same idea
  # with structure - spans, parents, durations - so "the agent's query cost 7
  # backend calls" stops being a counter and becomes a shape you can look at.
  #
  #   16686 = UI
  #   4317  = OTLP/gRPC     4318 = OTLP/HTTP   (the services export here)
  # --------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: iap-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:

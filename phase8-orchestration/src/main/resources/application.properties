spring.application.name=orchestration
server.port=${SERVER_PORT:8087}

# ---------------------------------------------------------------------------
# Temporal. `docker compose up -d temporal` gives 7233 (gRPC) and 8233 (UI).
# ---------------------------------------------------------------------------
temporal.target=${TEMPORAL_TARGET:127.0.0.1:7233}

# ---------------------------------------------------------------------------
# The activities call the Phase 2 facade THROUGH the Phase 3 gateway, so a
# workflow is subject to the same auth and rate limiting as every other
# consumer. An orchestrator that bypassed the gateway would be the one caller
# exempt from the platform's own policy.
# ---------------------------------------------------------------------------
inventory.api.base-url=${INVENTORY_API:http://localhost:8000}
inventory.api.key=${INVENTORY_API_KEY:local-demo-key-internal}

# ---------------------------------------------------------------------------
# Distributed tracing (Phase 7).
# ---------------------------------------------------------------------------
management.tracing.sampling.probability=${TRACE_SAMPLE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.enabled=true

management.endpoints.web.exposure.include=health,info
logging.level.com.jdoan.inventory.orchestration=DEBUG

spring.application.name=graphql-facade
server.port=${SERVER_PORT:8086}

# ---------------------------------------------------------------------------
# Upstream SOAP service (Phase 1). Must be running on 8081.
# The GraphQL facade is a SIBLING of the REST facade, not a layer on top of it:
# both call the same contract, neither depends on the other.
# ---------------------------------------------------------------------------
inventory.soap.uri=${SOAP_URI:http://localhost:8081/ws}

# ---------------------------------------------------------------------------
# Redis - entity cache, keyed by SKU rather than by URL. See InventoryService.
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
inventory.graphql.cache.enabled=${GRAPHQL_CACHE:true}

# ---------------------------------------------------------------------------
# Query cost limits - what Kong structurally cannot enforce.
# Tuned against measured scores, not guessed:
#   lowStock { sku }                              ->   51  accepted
#   lowStock { sku quantity product { ... } }     ->  251  accepted (and costs 7 backend calls)
#   lowStock { product { stockLevels { ... } } }  -> 3951  REJECTED
# The middle one is the interesting case: expensive enough to hurt, cheap enough
# to allow, and indistinguishable from the first one to anything counting HTTP
# requests. test-graphql.sh asserts all three.
# ---------------------------------------------------------------------------
inventory.graphql.max-depth=${GRAPHQL_MAX_DEPTH:10}
inventory.graphql.max-complexity=${GRAPHQL_MAX_COMPLEXITY:300}
# How many elements a list field is assumed to return when it has no `limit`
# argument. A schema where every list is paginated would not need this guess -
# which is a decent argument for requiring pagination on every list field.
inventory.graphql.default-page-size=${GRAPHQL_DEFAULT_PAGE_SIZE:25}

# ---------------------------------------------------------------------------
# GraphiQL at http://localhost:8086/graphiql - the schema browsing its own docs
# is the fastest way to show what a self-describing contract buys you.
# ---------------------------------------------------------------------------
spring.graphql.graphiql.enabled=true
spring.graphql.schema.printer.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
logging.level.com.jdoan.inventory.graphql=DEBUG

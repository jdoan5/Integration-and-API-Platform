# ============================================================================
# The public read-only demo (Cloud Run).
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#
# One container, no PostgreSQL, no SOAP service, no Redis, no gateway. The
# schema, the resolvers, the validation and the cost analysis are all the real
# ones; only the data source is swapped, for a snapshot exported from the real
# inventory_mgmt database. See DemoInventoryBackend for exactly what is real and
# what is not.
# ============================================================================

# Cloud Run injects PORT and expects the container to listen on it. Defaulting
# to 8080 rather than 8086 because that is Cloud Run's convention, and a
# container that ignores $PORT is marked unhealthy with no useful message.
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# No Redis. The entity cache is an optimisation and this profile does without
# it; the fixture is already in memory, so caching it would cache a HashMap.
#
# Turning this off also makes the mutation refuse for a SECOND reason, which is
# the correct behaviour: an idempotencyKey cannot be honoured with nowhere to
# store it, and the write is refused before that matters anyway.
# ---------------------------------------------------------------------------
inventory.graphql.cache.enabled=false
management.health.redis.enabled=false

# ---------------------------------------------------------------------------
# Tracing off. There is no collector to export to, and a container retrying an
# unreachable OTLP endpoint every few seconds is noise that costs money.
# ---------------------------------------------------------------------------
management.opentelemetry.tracing.export.enabled=false
management.tracing.enabled=false

# ---------------------------------------------------------------------------
# The cost limits are the POINT of the demo, so they stay exactly as configured
# for the real deployment. A visitor who writes an expensive query should be
# refused by the same instrumentation, with the same score.
# ---------------------------------------------------------------------------
inventory.graphql.max-depth=${GRAPHQL_MAX_DEPTH:10}
inventory.graphql.max-complexity=${GRAPHQL_MAX_COMPLEXITY:300}
inventory.graphql.default-page-size=${GRAPHQL_DEFAULT_PAGE_SIZE:25}

# GraphiQL is the demo. Introspection must stay on for it to work at all.
spring.graphql.graphiql.enabled=true
spring.graphql.schema.introspection.enabled=true
spring.graphql.schema.printer.enabled=true

management.endpoints.web.exposure.include=health
logging.level.com.jdoan.inventory.graphql=INFO
